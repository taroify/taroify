name: Deploy Site

on:
  workflow_run:
    workflows:
      - Create Release Tag
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20.19.0"
  PNPM_VERSION: "10.34.5"

jobs:
  build-and-deploy:
    if: >-
      github.repository == 'taroify/taroify' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare bundle workspaces
        run: pnpm run prepare:workspaces

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build Site
        run: pnpm run build:www
        env:
          CHANGELOG_STRICT: "true"
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        env:
          LEFTHOOK: "0"
        with:
          branch: gh-pages
          folder: bundles/www
          token: ${{ secrets.TAROIFY_SITE_TOKEN }}
          repository-name: taroify/taroify.com
          single-commit: true
          clean: true
