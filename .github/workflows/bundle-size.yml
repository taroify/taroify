name: Bundle Size

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bundle-size*.yml"
      - "gulpfile.js"
      - "package.json"
      - "packages/**"
      - "scripts/bundle-size-report.mjs"
      - "scripts/prepare-bundle-workspaces.mjs"
      - "tsconfig.json"
      - "typings.d.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19.0"
  PNPM_VERSION: "10.34.5"

jobs:
  measure:
    if: github.repository == 'taroify/taroify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare pull request bundle workspaces
        run: pnpm run prepare:workspaces

      - name: Install pull request dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build pull request packages
        run: |
          pnpm run build:packages
          pnpm run build:cli

      - name: Measure pull request packages
        run: node scripts/bundle-size-report.mjs --output current.json

      - name: Prepare base worktree
        run: |
          BASE_PATH=".ci-bundle-base-${RANDOM}-${RANDOM}"
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          git worktree add --detach "$BASE_PATH" "${{ github.event.pull_request.base.sha }}"

      - name: Install base dependencies
        run: |
          if [ -f "$BASE_PATH/pnpm-lock.yaml" ]; then
            pnpm --dir "$BASE_PATH" run prepare:workspaces
            pnpm --dir "$BASE_PATH" install --frozen-lockfile --ignore-scripts
          else
            (
              cd "$BASE_PATH"
              corepack yarn install --frozen-lockfile --ignore-scripts
            )
          fi

      - name: Build base packages
        run: |
          if [ -f "$BASE_PATH/pnpm-lock.yaml" ]; then
            pnpm --dir "$BASE_PATH" run build:packages
            pnpm --dir "$BASE_PATH" run build:cli
          else
            (
              cd "$BASE_PATH"
              corepack yarn run build:packages
              corepack yarn run build:cli
            )
          fi

      - name: Measure base packages
        run: |
          node scripts/bundle-size-report.mjs \
            --bundles-dir "${BASE_PATH}/bundles" \
            --output base.json

      - name: Compare package sizes
        run: |
          node scripts/bundle-size-report.mjs \
            --compare base.json \
            --current current.json \
            --output stats.txt

      - name: Upload package size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-size-stats
          path: stats.txt
          retention-days: 1

      - name: Cleanup base worktree
        if: always()
        run: |
          if [ -n "${BASE_PATH:-}" ] && [ -d "$BASE_PATH" ]; then
            git worktree remove --force "$BASE_PATH"
          fi
