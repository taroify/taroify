# yaml-language-server:$schema=./node_modules/lefthook/schema.json
# https://evilmartians.github.io/lefthook/configuration/

pre-commit:
  piped: true
  follow: true
  commands:
    staged:
      priority: 1
      run: echo {staged_files}
    security:
      priority: 2
      run: node scripts/security.js
    typescript:
      priority: 3
      glob: "*.{ts,tsx}"
      exclude: "site/**"
      run: pnpm exec tsc jest/jest-setup.ts {staged_files} --noEmit --jsx react-jsx --target esnext --module esnext --moduleResolution node --allowSyntheticDefaultImports --lib esnext,dom --downlevelIteration --skipLibCheck --esModuleInterop
    typescript-site:
      priority: 3
      glob: "site/**/*.{ts,tsx}"
      run: pnpm exec tsc -p site/tsconfig.json
    biome:
      priority: 4
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: pnpm exec biome check --fix {staged_files} --reporter summary --no-errors-on-unmatched
      stage_fixed: true
    prettier: # Biome 尚不支持 markdown 文件
      priority: 6
      glob: "*.{md,mdx,html,htm,yaml,yml,scss}"
      run: pnpm exec prettier --write {staged_files}
    stylelint: # Biome 尚不支持 scss 文件
      priority: 7
      glob: "*.{scss}"
      run: pnpm exec stylelint --fix {staged_files}
    catalog:
      priority: 8
      run: node scripts/build-catalog.mjs
      stage_fixed: true

prepare-commit-msg:
  commands:
    commit:
      interactive: true
      run: |
        if [ -d "$(git rev-parse --git-path rebase-merge)" ] ||
           [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
          exit 0
        fi

        pnpm exec git-cz --hook
      env:
        LEFTHOOK: "0"
